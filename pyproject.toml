[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent_skill"
version = "0.1.0"
description = "Deterministic utilities, constraint satisfaction, and code analysis helpers for Python"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agent-skill-setup = "agent_skill.configure:main"

[project.optional-dependencies]
all = [
    "ortools>=9.8",
    "onnxruntime>=1.17",
    "graphifyy>=0.9",
    "tree-sitter>=0.25"
]
