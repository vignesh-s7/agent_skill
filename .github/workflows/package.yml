name: Package CI & Wheels

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Wheel & Validate
        run: |
          python -m pip install --upgrade pip build
          python -m build
          echo "Build successful."
